# GitHub Actions: rebuild the dashboard and publish it automatically.
# No more "re-run python dashboard.py" — push, and ~1 min later the
# live site is updated.
#
# HOW IT WORKS:
#   - "on: push" runs this script every time code lands on 'main'
#   - Python regenerates index.html from data.py
#   - "pages: write" publishes it as your GitHub Pages site
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # rebuild every 30 min: clock, countdowns, NEXT UP, weather

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel a deploy mid-run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild dashboard from data.py
        run: python dashboard.py

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .            # publish everything in the repo root

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
